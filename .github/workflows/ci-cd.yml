name: NutriRed CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Pruebas y Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-7.0

      # El gate de cobertura lo hace Jest automáticamente (coverageThreshold en jest.config.js)
      - name: Ejecutar pruebas con cobertura
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret' }}
          JWT_EXPIRES_IN: '1h'
          NODE_ENV: test
        run: npm test
            - name: Descargar historial completo (para Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  deploy-staging:
    name: Despliegue en Entorno de Prueba
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de producción
        run: npm ci --omit=dev

      - name: Despliegue (opcional)
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -X POST "$DEPLOY_HOOK"
            echo "✅ Despliegue disparado"
          else
            echo "⚠️  DEPLOY_HOOK no configurado, saltando despliegue"
          fi
